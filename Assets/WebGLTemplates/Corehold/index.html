<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Canvas fills the viewport and rescales on orientation change */
    #unity-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0b0e14;
      touch-action: none;
    }

    /* CSS loading screen driven by createUnityInstance() progress */
    #unity-loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #16202e 0%, #0b0e14 70%);
      transition: opacity 0.5s ease;
    }

    #unity-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #unity-logo {
      font-size: clamp(28px, 6vw, 54px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6fd3ff;
      text-shadow: 0 0 18px rgba(111, 211, 255, 0.4);
      margin-bottom: 8vh;
    }

    #unity-progress-track {
      width: min(60vw, 340px);
      height: 8px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 4px;
      overflow: hidden;
    }

    #unity-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2f7fff, #6fd3ff);
      border-radius: 4px;
      transition: width 0.2s ease;
    }

    #unity-progress-label {
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: #8fa1b3;
    }

    #unity-warning {
      position: fixed;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="unity-loading">
    <div id="unity-logo">{{{ PRODUCT_NAME }}}</div>
    <div id="unity-progress-track">
      <div id="unity-progress-fill"></div>
    </div>
    <div id="unity-progress-label">Loading… 0%</div>
  </div>

  <div id="unity-warning"></div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingOverlay = document.querySelector("#unity-loading");
    var progressFill = document.querySelector("#unity-progress-fill");
    var progressLabel = document.querySelector("#unity-progress-label");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      warningBanner.style.display = "block";
      warningBanner.innerHTML = msg;
      if (type === "error") warningBanner.style.background = "rgba(120,20,20,0.85)";
      if (type === "warning") {
        setTimeout(function () { warningBanner.style.display = "none"; }, 5000);
      }
    }

    // Keep the drawing buffer matched to the CSS viewport size across
    // resize and orientation-change events so the canvas rescales cleanly.
    function resizeCanvas() {
      var dpr = window.devicePixelRatio || 1;
      var w = window.innerWidth;
      var h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", function () {
      // Delay to allow the browser to report post-rotation dimensions.
      setTimeout(resizeCanvas, 200);
    });

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      showBanner: unityShowBanner,
    };

    // Do not steal keystrokes from surrounding page chrome (e.g. itch comment box).
    config.autoSyncPersistentDataPath = true;

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        progressFill.style.width = pct + "%";
        progressLabel.textContent = "Loading… " + pct + "%";
      }).then(function (unityInstance) {
        // Fade out the loading screen once the game is ready — no black screen.
        loadingOverlay.classList.add("hidden");
        setTimeout(function () {
          if (loadingOverlay.parentNode) loadingOverlay.parentNode.removeChild(loadingOverlay);
        }, 600);
        if (typeof WebGLInput !== "undefined") {
          // Prevent swallowing keys intended for the host page.
          try { unityInstance.Module.WebGLInput.captureAllKeyboardInput = false; } catch (e) {}
        }
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
